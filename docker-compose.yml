services:
  db:
    image: postgres:16-alpine
    container_name: short-url-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: shorturl
      POSTGRES_PASSWORD: shorturl
      POSTGRES_DB: short_url_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shorturl -d short_url_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: short-url-app
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://shorturl:shorturl@db:5432/short_url_db}
      JWT_SECRET: ${JWT_SECRET}
      PORT: ${PORT:-3000}
      OBSERVABILITY_ENABLED: ${OBSERVABILITY_ENABLED:-true}
      OBSERVABILITY_PROVIDER: ${OBSERVABILITY_PROVIDER:-sentry}
      SENTRY_DSN: ${SENTRY_DSN:-}
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PRETTY: ${LOG_PRETTY:-true}
      HASHIDS_SALT: ${HASHIDS_SALT}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
